name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    backend:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend

        services:
            db:
                image: postgres:17
                env:
                    POSTGRES_DB: movies
                    POSTGRES_USER: movies
                    POSTGRES_PASSWORD: movies
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U movies -d movies"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        # settings.py reads these at import time
        env:
            SECRET_KEY: ci-only
            ALLOWED_HOSTS: localhost
            POSTGRES_DB: movies
            POSTGRES_USER: movies
            POSTGRES_PASSWORD: movies
            DB_HOST: localhost
            DB_PORT: 5432

        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-python@v6
              with:
                  python-version: "3.13"
                  cache: pip
                  cache-dependency-path: backend/requirements.txt

            - name: Install dependencies
              run: pip install -r requirements.txt

            - name: Check for missing migrations
              run: python manage.py makemigrations --check --dry-run

            # WhiteNoise warns if the static dir is missing
            - name: Collect static files
              run: python manage.py collectstatic --noinput

            - name: Run tests
              run: python manage.py test

    frontend:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend

        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Build
              run: npm run build

    docker:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            # compose refuses to load if env_file is missing; real values aren't needed to build
            - name: Create placeholder env file
              run: touch .env.prod

            - name: Build production images
              run: docker compose -f docker-compose.prod.yml build

            # Validate the Caddyfile inside the built image so the Caddy version always matches prod
            - name: Validate Caddyfile
              run: >
                  docker run --rm johnpennyman/react-app:2.0-prod
                  caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
    deploy:
        # only after every check passes, and only for pushes to main (not PRs)
        needs: [backend, frontend, docker]
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        concurrency:
            group: deploy-production
            cancel-in-progress: false

        steps:
            - name: Set up SSH
              run: |
                  mkdir -p ~/.ssh
                  echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
                  chmod 600 ~/.ssh/deploy_key
                  echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

            - name: Deploy
              run: ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}

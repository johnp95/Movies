services:
    react-app:
        build:
            context: ./frontend
        image: johnpennyman/react-app:2.0
        container_name: movies-react-app-1
        ports:
            - "5173:5173"
        volumes:
            - ./frontend:/app
            - /app/node_modules
        networks:
            - app-network
        depends_on:
            - backend

    backend:
        build: ./backend
        image: johnpennyman/backend:2.0
        container_name: movies-backend-1
        ports:
            - "8000:8000"
        command: python manage.py runserver 0.0.0.0:8000
        volumes:
            - ./backend:/code
        depends_on:
            db:
                condition: service_healthy
                restart: true
        env_file:
            - .env
        environment:
            - POSTGRES_DB=${POSTGRES_DB}
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - DB_HOST=${DB_HOST}
            - DB_PORT=${DB_PORT}
        networks:
            - app-network
        extra_hosts:
            - "host.docker.internal:host-gateway"

    db:
        image: postgres:17
        container_name: postgres_db
        networks:
            - app-network
        volumes:
            - postgres_db:/var/lib/postgresql/data
        environment:
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
                ]
            interval: 10s
            retries: 5
            start_period: 30s
            timeout: 10s

volumes:
    postgres_db:

networks:
    app-network:
        driver: bridge
